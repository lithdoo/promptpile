# Provider/profile 内容只由 Promptpile 解析。
[[llm_api]]
name = "default"
model = "your-model"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

# 可选：Promptpile 自己消费的字段。React 只读取与编排相关的兼容子集。
[promptpile]
quiet = false

[promptpile-react]
dir = "./message"
# 分层读取时用 dirs 替代 dir，并指定唯一写入层：
# dirs = ["./base", "./reference"]
# output_dir = "./session"

max_step = 3
continue = false
input = false
quiet = false

thought_prompt = "./thought.md"
observe_prompt = "./observe.md"
check_prompt = "./check.md"
final_prompt = "./final.md"

thought_llm_api = "default"
observe_llm_api = "default"
check_llm_api = "default"
final_llm_api = "default"
