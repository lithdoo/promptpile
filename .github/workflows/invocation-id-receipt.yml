name: Invocation ID and Completion Receipt v1

on:
  push:
    branches: [main]
    paths:
      - 'package-lock.json'
      - 'packages/promptpile/**'
      - 'doc/15-contracts/completion-receipt-v1.schema.json'
      - 'INVOCATION_ID_PLAN.md'
      - 'COMPLETION_RECEIPT_PLAN.md'
      - '.github/workflows/invocation-id-receipt.yml'
  pull_request:
    paths:
      - 'package-lock.json'
      - 'packages/promptpile/**'
      - 'doc/15-contracts/completion-receipt-v1.schema.json'
      - 'INVOCATION_ID_PLAN.md'
      - 'COMPLETION_RECEIPT_PLAN.md'
      - '.github/workflows/invocation-id-receipt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invocation-receipt:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --workspace=promptpile-protocol --workspace=promptpile
      - run: npm run build -w promptpile-protocol
      - run: npm run build -w promptpile
      - name: Verify invocation and receipt contracts
        run: >-
          node packages/promptpile/test/llm-extra-body.cjs &&
          node packages/promptpile/test/request-core-authority.cjs &&
          node packages/promptpile/test/stream-terminal-state.cjs &&
          node packages/promptpile/test/stream-terminal-cli.cjs &&
          node packages/promptpile/test/llm-sampling.cjs &&
          node packages/promptpile/test/strict-toml-types.cjs &&
          node packages/promptpile/test/llm-config-cli.cjs &&
          node packages/promptpile/test/cli-package-version.cjs &&
          node packages/promptpile/test/invocation-context.cjs &&
          node packages/promptpile/test/completion-receipt-schema.cjs &&
          node packages/promptpile/test/invocation-id-receipt.cjs &&
          node packages/promptpile/test/after-hook-security.cjs &&
          node packages/promptpile/test/output-artifact-policy.cjs &&
          node packages/promptpile/test/resolve-config.cjs &&
          node packages/promptpile/test/root-conversation-occ.cjs
      - name: Verify independent packed installation
        run: npm run package:smoke -w promptpile
