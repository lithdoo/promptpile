name: Promptpile React v1

on:
  push:
    paths:
      - 'packages/promptpile-react/**'
      - 'packages/promptpile/**'
      - 'packages/promptpile-protocol/**'
      - 'package.json'
      - 'package-lock.json'
      - 'REACT_STREAMING_OUTPUT_PLAN.md'
      - '.github/workflows/promptpile-react-v1.yml'
  pull_request:

permissions:
  contents: read

jobs:
  orchestration-freeze:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build -w promptpile-protocol
      - run: npm run build -w promptpile
      - run: npm test -w promptpile-react
      - run: npm run package:smoke -w promptpile-react
