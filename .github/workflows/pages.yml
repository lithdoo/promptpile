name: Docs / GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install active package dependencies
        run: >-
          npm ci --ignore-scripts
          --workspace=promptpile
          --workspace=promptpile-mcp
          --workspace=promptpile-react
          --workspace=promptpile-plan
          --workspace=promptpile-compress

      - name: Build active packages
        run: npm run build

      - name: Test active packages
        run: npm test

      - name: Bootstrap agent tool base
        run: |
          npm ci --ignore-scripts --workspace=@agent-tool-lite/base
          npm run build -w @agent-tool-lite/base

      - name: Install supporting agent tool dependencies
        run: npm ci --ignore-scripts --workspace=agent-lite-tools

      - name: Build supporting agent tools in dependency order
        run: npm run build:agent-tools

      - name: Test supporting agent tools
        run: npm run test:agent-tools

      - name: Build VitePress documentation
        run: npm run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: doc/.vitepress/dist

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
