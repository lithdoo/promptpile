name: Output Artifact Policy v1

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  output-policy-matrix:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install Promptpile core
        run: npm ci --ignore-scripts --workspace=promptpile

      - name: Build Promptpile core
        run: npm run build -w promptpile

      - name: Verify resolved policy, collision, ledger, and partial writes
        run: node packages/promptpile/test/output-artifact-policy.cjs

      - name: Verify pile lifecycle failures
        run: node packages/promptpile/test/output-pile.cjs

      - name: Verify CLI stage ordering and hook ledger
        run: node packages/promptpile/test/output-artifact-policy-cli.cjs

      - name: Verify OCC post-model retention and primary failures
        run: node packages/promptpile/test/root-conversation-occ.cjs && node packages/promptpile/test/conversation-occ-primitives.cjs

      - name: Verify hook security boundary
        run: node packages/promptpile/test/after-hook-security.cjs
