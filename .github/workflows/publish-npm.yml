name: Publish npm beta

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Setup Node for npm Trusted Publishing
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install current npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate active packages
        run: npm test

      - name: Validate packed archive consumer
        run: npm run package:smoke -w promptpile-compress-grep-search

      - name: Build documentation
        run: npm run docs:build

      - name: Publish unpublished beta versions
        shell: bash
        run: |
          packages=(
            promptpile
            promptpile-mcp
            promptpile-compress
            promptpile-compress-grep-search
            promptpile-react
            promptpile-plan
          )

          for package in "${packages[@]}"; do
            version=$(node -p "require('./packages/$package/package.json').version")
            if npm view "$package@$version" version >/dev/null 2>&1; then
              echo "Already published: $package@$version"
              continue
            fi
            npm publish --workspace="$package" --tag=beta --access=public
          done
