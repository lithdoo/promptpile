name: Conversation Optimistic Concurrency

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  occ-matrix:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install Promptpile core
        run: npm ci --ignore-scripts --workspace=promptpile

      - name: Build Promptpile core
        run: npm run build -w promptpile

      - name: Verify claim, owner, cleanup, and crash semantics
        run: node packages/promptpile/test/conversation-occ-primitives.cjs

      - name: Verify real append-user contention
        run: node packages/promptpile/test/conversation-append-user-occ.cjs

      - name: Verify root preflight, commit recheck, and derived baseline
        run: node packages/promptpile/test/root-conversation-occ.cjs
