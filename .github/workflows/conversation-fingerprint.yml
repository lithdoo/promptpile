name: Conversation Fingerprint v1

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint-matrix:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install Promptpile core
        run: npm ci --ignore-scripts --workspace=promptpile

      - name: Build Promptpile core
        run: npm run build -w promptpile

      - name: Verify protocol scanner order
        run: node packages/promptpile/test/protocol-scanner.cjs

      - name: Verify canonical bytes and golden tokens
        run: node packages/promptpile/test/conversation-fingerprint-encoding.cjs

      - name: Verify stable filesystem observations
        run: node packages/promptpile/test/conversation-fingerprint-observation.cjs

      - name: Verify public CLI contract
        run: node packages/promptpile/test/conversation-fingerprint-cli.cjs
