name: Context lifecycle quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filesystem-matrix:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install lifecycle packages
        run: npm ci --ignore-scripts --workspace=promptpile-protocol --workspace=promptpile-compress --workspace=promptpile-compress-grep-search

      - name: Build Promptpile protocol
        run: npm run build -w promptpile-protocol

      - name: Test producer, restore, lock, and recovery
        run: npm run test -w promptpile-compress

      - name: Test independent Archive Protocol consumer
        run: npm run test -w promptpile-compress-grep-search

      - name: Smoke test packed archive CLI
        if: matrix.node == 22
        run: npm run package:smoke -w promptpile-compress-grep-search

      - name: Check archive-search performance budget
        if: matrix.node == 22 && matrix.os == 'ubuntu-latest'
        run: npm run benchmark:check -w promptpile-compress-grep-search
